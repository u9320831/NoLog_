[package]
name = "NoLog_"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["client", "server", "dashboard", "protocol"]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
vbs-enclave = { path = "vendor-vbs-enclave-rs" }
x25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hex-literal = "0.4"
spin = "0.9"
zeroize = { version = "1", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography"] }
